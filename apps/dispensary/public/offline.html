<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F3EB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1814" media="(prefers-color-scheme: dark)" />
    <title>Pas de connexion | Dispensaire</title>
    <style>
      :root {
        --bg: #f7f3eb;
        --surface: #fffcf6;
        --border: #e8dfd0;
        --ink: #3d3429;
        --muted: #6b5f52;
        --accent: #4a6b5a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1814;
          --surface: #26201a;
          --border: #3b3329;
          --ink: #ece3d2;
          --muted: #b0a493;
          --accent: #82a892;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--ink);
        font-family: 'Courier Prime', 'Courier New', Courier, monospace;
      }
      main {
        max-width: 360px;
        width: 100%;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px 24px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 50%;
      }
      h1 {
        font-size: 1.35rem;
        margin: 16px 0 8px;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 24px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 700;
        font-size: 1rem;
        padding: 12px 28px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Pas de connexion</h1>
      <p>Le dispensaire a besoin d'internet. Vérifie ta connexion puis réessaie.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
