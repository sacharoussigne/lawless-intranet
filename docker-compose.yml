# Lawless Intranet — one container per app, shared monorepo build context.
# Requires external nginx-proxy network (same pattern as before).
#
# cp docker/.env.example .env.docker
# docker compose --env-file .env.docker up -d --build

services:
  auth:
    restart: unless-stopped
    container_name: "${COMPOSE_PROJECT_NAME:-lawless}-auth"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: auth
        APP_PORT: "3001"
        NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
        NEXT_PUBLIC_DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
        NEXT_PUBLIC_SHELTER_URL: "${SHELTER_PUBLIC_URL:-}"
        BETTER_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
        DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
        SHELTER_URL: "${SHELTER_PUBLIC_URL:-}"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: "${AUTH_DATABASE_URL:?err}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?err}"
      BETTER_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
      NEXT_PUBLIC_DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
      SHELTER_URL: "${SHELTER_PUBLIC_URL:-}"
      NEXT_PUBLIC_SHELTER_URL: "${SHELTER_PUBLIC_URL:-}"
      AUTH_COOKIE_DOMAIN: "${AUTH_COOKIE_DOMAIN:?err}"
      AUTH_VIRTUAL_HOST: "${AUTH_VIRTUAL_HOST:?err}"
      DISPENSARY_VIRTUAL_HOST: "${DISPENSARY_VIRTUAL_HOST:?err}"
      SHELTER_VIRTUAL_HOST: "${SHELTER_VIRTUAL_HOST:-}"
      DOCUMENTS_VIRTUAL_HOST: "${DOCUMENTS_VIRTUAL_HOST:-}"
      AGENDA_VIRTUAL_HOST: "${AGENDA_VIRTUAL_HOST:-}"
      BANK_VIRTUAL_HOST: "${BANK_VIRTUAL_HOST:-}"
      INVENTORY_VIRTUAL_HOST: "${INVENTORY_VIRTUAL_HOST:-}"
      EXTRA_TRUSTED_ORIGINS: "${EXTRA_TRUSTED_ORIGINS:-}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:?err}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:?err}"
      AUTH_INTERNAL_SECRET: "${AUTH_INTERNAL_SECRET:?err}"
      ACCESS_ON_CREATE: "${ACCESS_ON_CREATE:-}"
      # nginx-proxy / letsencrypt
      VIRTUAL_HOST: "${AUTH_VIRTUAL_HOST:?err}"
      VIRTUAL_PORT: "3001"
      LETSENCRYPT_HOST: "${AUTH_VIRTUAL_HOST:?err}"
      LETSENCRYPT_DNS_CHALLENGE: "${LETSENCRYPT_DNS_CHALLENGE:-true}"
      SELF_SIGNED_HOST: "${AUTH_VIRTUAL_HOST:?err}"
    networks:
      - proxy
      - db

  dispensary:
    restart: unless-stopped
    container_name: "${COMPOSE_PROJECT_NAME:-lawless}-dispensary"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: dispensary
        APP_PORT: "3000"
        NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
        NEXT_PUBLIC_APP_URL: "${DISPENSARY_PUBLIC_URL:?err}"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "${DISPENSARY_DATABASE_URL:?err}"
      AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      NEXT_PUBLIC_APP_URL: "${DISPENSARY_PUBLIC_URL:?err}"
      AUTH_INTERNAL_SECRET: "${AUTH_INTERNAL_SECRET:?err}"
      DOCUMENTS_URL: "${DOCUMENTS_PUBLIC_URL:-http://documents:3002}"
      DOCUMENTS_INTERNAL_SECRET: "${DOCUMENTS_INTERNAL_SECRET:?err}"
      AGENDA_URL: "${AGENDA_PUBLIC_URL:-http://agenda:3003}"
      AGENDA_INTERNAL_SECRET: "${AGENDA_INTERNAL_SECRET:?err}"
      BANK_URL: "${BANK_PUBLIC_URL:-http://bank:3004}"
      BANK_INTERNAL_SECRET: "${BANK_INTERNAL_SECRET:?err}"
      BANK_BOT_API_SECRET: "${BANK_BOT_API_SECRET:-}"
      INVENTORY_URL: "${INVENTORY_PUBLIC_URL:-http://inventory:3005}"
      INVENTORY_INTERNAL_SECRET: "${INVENTORY_INTERNAL_SECRET:?err}"
      # Media library service (private network, see the media service)
      MEDIA_URL: "http://media:3009"
      MEDIA_INTERNAL_SECRET: "${MEDIA_INTERNAL_SECRET:?err}"
      # Browser websocket URL (read at runtime) + secret to sign realtime tokens
      REALTIME_PUBLIC_URL: "${REALTIME_PUBLIC_URL:?err}"
      REALTIME_TOKEN_SECRET: "${REALTIME_TOKEN_SECRET:?err}"
      NEXT_PUBLIC_APP_ENV: "${APP_ENV:-PROD}"
      TZ: "${TZ:-UTC}"
      DISPENSARY_BOT_API_SECRET: "${DISPENSARY_BOT_API_SECRET:-}"
      VIRTUAL_HOST: "${DISPENSARY_VIRTUAL_HOST:?err}"
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: "${DISPENSARY_VIRTUAL_HOST:?err}"
      LETSENCRYPT_DNS_CHALLENGE: "${LETSENCRYPT_DNS_CHALLENGE:-true}"
      SELF_SIGNED_HOST: "${DISPENSARY_VIRTUAL_HOST:?err}"
    networks:
      - proxy
      - db
      - media

  documents:
    restart: unless-stopped
    container_name: "${COMPOSE_PROJECT_NAME:-lawless}-documents"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: documents
        APP_PORT: "3002"
        NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
        DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
    environment:
      NODE_ENV: production
      PORT: "3002"
      DATABASE_URL: "${DOCUMENTS_DATABASE_URL:?err}"
      AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
      DOCUMENTS_INTERNAL_SECRET: "${DOCUMENTS_INTERNAL_SECRET:?err}"
      VIRTUAL_HOST: "${DOCUMENTS_VIRTUAL_HOST:?err}"
      VIRTUAL_PORT: "3002"
      LETSENCRYPT_HOST: "${DOCUMENTS_VIRTUAL_HOST:?err}"
      LETSENCRYPT_DNS_CHALLENGE: "${LETSENCRYPT_DNS_CHALLENGE:-true}"
      SELF_SIGNED_HOST: "${DOCUMENTS_VIRTUAL_HOST:?err}"
    networks:
      - proxy
      - db

  agenda:
    restart: unless-stopped
    container_name: "${COMPOSE_PROJECT_NAME:-lawless}-agenda"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: agenda
        APP_PORT: "3003"
        NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
        DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
    environment:
      NODE_ENV: production
      PORT: "3003"
      DATABASE_URL: "${AGENDA_DATABASE_URL:?err}"
      AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
      AGENDA_INTERNAL_SECRET: "${AGENDA_INTERNAL_SECRET:?err}"
      # Publishes changes to the realtime server over the private network
      REALTIME_INTERNAL_URL: "http://realtime:3008"
      REALTIME_INTERNAL_SECRET: "${REALTIME_INTERNAL_SECRET:?err}"
      VIRTUAL_HOST: "${AGENDA_VIRTUAL_HOST:?err}"
      VIRTUAL_PORT: "3003"
      LETSENCRYPT_HOST: "${AGENDA_VIRTUAL_HOST:?err}"
      LETSENCRYPT_DNS_CHALLENGE: "${LETSENCRYPT_DNS_CHALLENGE:-true}"
      SELF_SIGNED_HOST: "${AGENDA_VIRTUAL_HOST:?err}"
    networks:
      - proxy
      - db
      - realtime

  bank:
    restart: unless-stopped
    container_name: "${COMPOSE_PROJECT_NAME:-lawless}-bank"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: bank
        APP_PORT: "3004"
        NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
        DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
    environment:
      NODE_ENV: production
      PORT: "3004"
      DATABASE_URL: "${BANK_DATABASE_URL:?err}"
      AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
      SHELTER_URL: "${SHELTER_PUBLIC_URL:-}"
      BANK_INTERNAL_SECRET: "${BANK_INTERNAL_SECRET:?err}"
      BANK_BOT_API_SECRET: "${BANK_BOT_API_SECRET:-}"
      VIRTUAL_HOST: "${BANK_VIRTUAL_HOST:?err}"
      VIRTUAL_PORT: "3004"
      LETSENCRYPT_HOST: "${BANK_VIRTUAL_HOST:?err}"
      LETSENCRYPT_DNS_CHALLENGE: "${LETSENCRYPT_DNS_CHALLENGE:-true}"
      SELF_SIGNED_HOST: "${BANK_VIRTUAL_HOST:?err}"
    networks:
      - proxy
      - db

  inventory:
    restart: unless-stopped
    container_name: "${COMPOSE_PROJECT_NAME:-lawless}-inventory"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: inventory
        APP_PORT: "3005"
        NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
        DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
    environment:
      NODE_ENV: production
      PORT: "3005"
      DATABASE_URL: "${INVENTORY_DATABASE_URL:?err}"
      AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
      INVENTORY_INTERNAL_SECRET: "${INVENTORY_INTERNAL_SECRET:?err}"
      VIRTUAL_HOST: "${INVENTORY_VIRTUAL_HOST:?err}"
      VIRTUAL_PORT: "3005"
      LETSENCRYPT_HOST: "${INVENTORY_VIRTUAL_HOST:?err}"
      LETSENCRYPT_DNS_CHALLENGE: "${LETSENCRYPT_DNS_CHALLENGE:-true}"
      SELF_SIGNED_HOST: "${INVENTORY_VIRTUAL_HOST:?err}"
    networks:
      - proxy
      - db

  shelter:
    restart: unless-stopped
    container_name: "${COMPOSE_PROJECT_NAME:-lawless}-shelter"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: shelter
        APP_PORT: "3006"
        NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
        NEXT_PUBLIC_APP_URL: "${SHELTER_PUBLIC_URL:?err}"
    environment:
      NODE_ENV: production
      PORT: "3006"
      DATABASE_URL: "${SHELTER_DATABASE_URL:?err}"
      AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      NEXT_PUBLIC_APP_URL: "${SHELTER_PUBLIC_URL:?err}"
      AUTH_INTERNAL_SECRET: "${AUTH_INTERNAL_SECRET:?err}"
      BANK_URL: "${BANK_PUBLIC_URL:-http://bank:3004}"
      BANK_INTERNAL_SECRET: "${BANK_INTERNAL_SECRET:?err}"
      NEXT_PUBLIC_APP_ENV: "${APP_ENV:-PROD}"
      TZ: "${TZ:-UTC}"
      VIRTUAL_HOST: "${SHELTER_VIRTUAL_HOST:?err}"
      VIRTUAL_PORT: "3006"
      LETSENCRYPT_HOST: "${SHELTER_VIRTUAL_HOST:?err}"
      LETSENCRYPT_DNS_CHALLENGE: "${LETSENCRYPT_DNS_CHALLENGE:-true}"
      SELF_SIGNED_HOST: "${SHELTER_VIRTUAL_HOST:?err}"
      DOCUMENTS_URL: "${DOCUMENTS_PUBLIC_URL:?err}"
      DOCUMENTS_INTERNAL_SECRET: "${DOCUMENTS_INTERNAL_SECRET:?err}"
      # Media library service (private network, see the media service)
      MEDIA_URL: "http://media:3009"
      MEDIA_INTERNAL_SECRET: "${MEDIA_INTERNAL_SECRET:?err}"
      # Browser websocket URL (read at runtime) + secret to sign realtime tokens
      REALTIME_PUBLIC_URL: "${REALTIME_PUBLIC_URL:?err}"
      REALTIME_TOKEN_SECRET: "${REALTIME_TOKEN_SECRET:?err}"
    networks:
      - proxy
      - db
      - media

  # Media library API (files in S3). Not public: only called server-side by
  # dispensary and shelter over the private "media" network (no VIRTUAL_HOST). Browsers upload
  # and download straight from S3 with presigned URLs.
  media:
    restart: unless-stopped
    container_name: "${COMPOSE_PROJECT_NAME:-lawless}-media"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: media
        APP_PORT: "3009"
        NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
    environment:
      NODE_ENV: production
      PORT: "3009"
      DATABASE_URL: "${MEDIA_DATABASE_URL:?err}"
      AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      MEDIA_INTERNAL_SECRET: "${MEDIA_INTERNAL_SECRET:?err}"
      S3_BUCKET: "${MEDIA_S3_BUCKET:?err}"
      S3_REGION: "${MEDIA_S3_REGION:?err}"
      AWS_ACCESS_KEY_ID: "${MEDIA_AWS_ACCESS_KEY_ID:?err}"
      AWS_SECRET_ACCESS_KEY: "${MEDIA_AWS_SECRET_ACCESS_KEY:?err}"
      S3_ENDPOINT: "${MEDIA_S3_ENDPOINT:-}"
      S3_FORCE_PATH_STYLE: "${MEDIA_S3_FORCE_PATH_STYLE:-false}"
      MEDIA_MAX_FILE_SIZE_MB: "${MEDIA_MAX_FILE_SIZE_MB:-20}"
      # Publishes library changes to the realtime server over the private network
      REALTIME_INTERNAL_URL: "http://realtime:3008"
      REALTIME_INTERNAL_SECRET: "${REALTIME_INTERNAL_SECRET:?err}"
      TZ: "${TZ:-UTC}"
    networks:
      - db
      - media
      - realtime

  # Realtime websocket server (plain Node, own Dockerfile).
  # - Port 3007: browser websocket, the only port routed by nginx-proxy (wss://REALTIME_VIRTUAL_HOST).
  # - Port 3008: internal API (/publish, /revoke) for services, reachable only on the
  #   private "realtime" network and protected by REALTIME_INTERNAL_SECRET.
  # No port is published on the host.
  realtime:
    restart: unless-stopped
    container_name: "${COMPOSE_PROJECT_NAME:-lawless}-realtime"
    build:
      context: .
      dockerfile: docker/realtime.Dockerfile
    environment:
      NODE_ENV: production
      WS_PORT: "3007"
      INTERNAL_PORT: "3008"
      ALLOWED_ORIGINS: "${DISPENSARY_PUBLIC_URL:?err},${SHELTER_PUBLIC_URL:?err}"
      REALTIME_TOKEN_SECRET: "${REALTIME_TOKEN_SECRET:?err}"
      REALTIME_INTERNAL_SECRET: "${REALTIME_INTERNAL_SECRET:?err}"
      TZ: "${TZ:-UTC}"
      VIRTUAL_HOST: "${REALTIME_VIRTUAL_HOST:?err}"
      VIRTUAL_PORT: "3007"
      LETSENCRYPT_HOST: "${REALTIME_VIRTUAL_HOST:?err}"
      LETSENCRYPT_DNS_CHALLENGE: "${LETSENCRYPT_DNS_CHALLENGE:-true}"
      SELF_SIGNED_HOST: "${REALTIME_VIRTUAL_HOST:?err}"
    expose:
      - "3007"
      - "3008"
    networks:
      - proxy
      - realtime

networks:
  proxy:
    external: true
  db:
    external: true
  # Private network between services and the realtime internal API (no outside access).
  realtime:
    internal: true
  # Private network between the hosts (dispensary, shelter) and the media service. Not "internal":
  # the media service must reach S3.
  media: {}
