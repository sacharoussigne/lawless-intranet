# Lawless Intranet — one container per app, shared monorepo build context.
# Requires external nginx-proxy network (same pattern as before).
#
# cp docker/.env.example .env.docker
# docker compose --env-file .env.docker up -d --build

services:
  auth:
    restart: unless-stopped
    container_name: "${COMPOSE_PROJECT_NAME:-lawless}-auth"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: auth
        APP_PORT: "3001"
        NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
        NEXT_PUBLIC_DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
        BETTER_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
        DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: "${AUTH_DATABASE_URL:?err}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?err}"
      BETTER_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
      NEXT_PUBLIC_DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
      AUTH_COOKIE_DOMAIN: "${AUTH_COOKIE_DOMAIN:?err}"
      AUTH_VIRTUAL_HOST: "${AUTH_VIRTUAL_HOST:?err}"
      DISPENSARY_VIRTUAL_HOST: "${DISPENSARY_VIRTUAL_HOST:?err}"
      DOCUMENTS_VIRTUAL_HOST: "${DOCUMENTS_VIRTUAL_HOST:-}"
      AGENDA_VIRTUAL_HOST: "${AGENDA_VIRTUAL_HOST:-}"
      BANK_VIRTUAL_HOST: "${BANK_VIRTUAL_HOST:-}"
      INVENTORY_VIRTUAL_HOST: "${INVENTORY_VIRTUAL_HOST:-}"
      EXTRA_TRUSTED_ORIGINS: "${EXTRA_TRUSTED_ORIGINS:-}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:?err}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:?err}"
      AUTH_INTERNAL_SECRET: "${AUTH_INTERNAL_SECRET:?err}"
      ACCESS_ON_CREATE: "${ACCESS_ON_CREATE:-}"
      # nginx-proxy / letsencrypt
      VIRTUAL_HOST: "${AUTH_VIRTUAL_HOST:?err}"
      VIRTUAL_PORT: "3001"
      LETSENCRYPT_HOST: "${AUTH_VIRTUAL_HOST:?err}"
      LETSENCRYPT_DNS_CHALLENGE: "${LETSENCRYPT_DNS_CHALLENGE:-true}"
      SELF_SIGNED_HOST: "${AUTH_VIRTUAL_HOST:?err}"
    networks:
      - proxy
      - db

  dispensary:
    restart: unless-stopped
    container_name: "${COMPOSE_PROJECT_NAME:-lawless}-dispensary"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: dispensary
        APP_PORT: "3000"
        NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
        NEXT_PUBLIC_APP_URL: "${DISPENSARY_PUBLIC_URL:?err}"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "${DISPENSARY_DATABASE_URL:?err}"
      AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      NEXT_PUBLIC_APP_URL: "${DISPENSARY_PUBLIC_URL:?err}"
      AUTH_INTERNAL_SECRET: "${AUTH_INTERNAL_SECRET:?err}"
      DOCUMENTS_URL: "${DOCUMENTS_PUBLIC_URL:-http://documents:3002}"
      DOCUMENTS_INTERNAL_SECRET: "${DOCUMENTS_INTERNAL_SECRET:?err}"
      AGENDA_URL: "${AGENDA_PUBLIC_URL:-http://agenda:3003}"
      AGENDA_INTERNAL_SECRET: "${AGENDA_INTERNAL_SECRET:?err}"
      BANK_URL: "${BANK_PUBLIC_URL:-http://bank:3004}"
      BANK_INTERNAL_SECRET: "${BANK_INTERNAL_SECRET:?err}"
      BANK_BOT_API_SECRET: "${BANK_BOT_API_SECRET:-}"
      INVENTORY_URL: "${INVENTORY_PUBLIC_URL:-http://inventory:3005}"
      INVENTORY_INTERNAL_SECRET: "${INVENTORY_INTERNAL_SECRET:?err}"
      NEXT_PUBLIC_APP_ENV: "${APP_ENV:-PROD}"
      TZ: "${TZ:-UTC}"
      DISPENSARY_BOT_API_SECRET: "${DISPENSARY_BOT_API_SECRET:-}"
      VIRTUAL_HOST: "${DISPENSARY_VIRTUAL_HOST:?err}"
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: "${DISPENSARY_VIRTUAL_HOST:?err}"
      LETSENCRYPT_DNS_CHALLENGE: "${LETSENCRYPT_DNS_CHALLENGE:-true}"
      SELF_SIGNED_HOST: "${DISPENSARY_VIRTUAL_HOST:?err}"
    networks:
      - proxy
      - db

  documents:
    restart: unless-stopped
    container_name: "${COMPOSE_PROJECT_NAME:-lawless}-documents"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: documents
        APP_PORT: "3002"
        NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
        DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
    environment:
      NODE_ENV: production
      PORT: "3002"
      DATABASE_URL: "${DOCUMENTS_DATABASE_URL:?err}"
      AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
      DOCUMENTS_INTERNAL_SECRET: "${DOCUMENTS_INTERNAL_SECRET:?err}"
      VIRTUAL_HOST: "${DOCUMENTS_VIRTUAL_HOST:?err}"
      VIRTUAL_PORT: "3002"
      LETSENCRYPT_HOST: "${DOCUMENTS_VIRTUAL_HOST:?err}"
      LETSENCRYPT_DNS_CHALLENGE: "${LETSENCRYPT_DNS_CHALLENGE:-true}"
      SELF_SIGNED_HOST: "${DOCUMENTS_VIRTUAL_HOST:?err}"
    networks:
      - proxy
      - db

  agenda:
    restart: unless-stopped
    container_name: "${COMPOSE_PROJECT_NAME:-lawless}-agenda"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: agenda
        APP_PORT: "3003"
        NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
        DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
    environment:
      NODE_ENV: production
      PORT: "3003"
      DATABASE_URL: "${AGENDA_DATABASE_URL:?err}"
      AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
      AGENDA_INTERNAL_SECRET: "${AGENDA_INTERNAL_SECRET:?err}"
      VIRTUAL_HOST: "${AGENDA_VIRTUAL_HOST:?err}"
      VIRTUAL_PORT: "3003"
      LETSENCRYPT_HOST: "${AGENDA_VIRTUAL_HOST:?err}"
      LETSENCRYPT_DNS_CHALLENGE: "${LETSENCRYPT_DNS_CHALLENGE:-true}"
      SELF_SIGNED_HOST: "${AGENDA_VIRTUAL_HOST:?err}"
    networks:
      - proxy
      - db

  bank:
    restart: unless-stopped
    container_name: "${COMPOSE_PROJECT_NAME:-lawless}-bank"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: bank
        APP_PORT: "3004"
        NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
        DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
    environment:
      NODE_ENV: production
      PORT: "3004"
      DATABASE_URL: "${BANK_DATABASE_URL:?err}"
      AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
      BANK_INTERNAL_SECRET: "${BANK_INTERNAL_SECRET:?err}"
      BANK_BOT_API_SECRET: "${BANK_BOT_API_SECRET:-}"
      VIRTUAL_HOST: "${BANK_VIRTUAL_HOST:?err}"
      VIRTUAL_PORT: "3004"
      LETSENCRYPT_HOST: "${BANK_VIRTUAL_HOST:?err}"
      LETSENCRYPT_DNS_CHALLENGE: "${LETSENCRYPT_DNS_CHALLENGE:-true}"
      SELF_SIGNED_HOST: "${BANK_VIRTUAL_HOST:?err}"
    networks:
      - proxy
      - db

  inventory:
    restart: unless-stopped
    container_name: "${COMPOSE_PROJECT_NAME:-lawless}-inventory"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: inventory
        APP_PORT: "3005"
        NEXT_PUBLIC_AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
        DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
    environment:
      NODE_ENV: production
      PORT: "3005"
      DATABASE_URL: "${INVENTORY_DATABASE_URL:?err}"
      AUTH_URL: "${AUTH_PUBLIC_URL:?err}"
      DISPENSARY_URL: "${DISPENSARY_PUBLIC_URL:?err}"
      INVENTORY_INTERNAL_SECRET: "${INVENTORY_INTERNAL_SECRET:?err}"
      VIRTUAL_HOST: "${INVENTORY_VIRTUAL_HOST:?err}"
      VIRTUAL_PORT: "3005"
      LETSENCRYPT_HOST: "${INVENTORY_VIRTUAL_HOST:?err}"
      LETSENCRYPT_DNS_CHALLENGE: "${LETSENCRYPT_DNS_CHALLENGE:-true}"
      SELF_SIGNED_HOST: "${INVENTORY_VIRTUAL_HOST:?err}"
    networks:
      - proxy
      - db

networks:
  proxy:
    external: true
  db:
    external: true
